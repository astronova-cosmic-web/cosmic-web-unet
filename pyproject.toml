[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicweb"
version = "0.1.0"
description = "U-Net reconstruction of weak-lensing mass maps with a hybrid pixel + power-spectrum loss"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AstroNova 2026 Cosmic Web team" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
